<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="288mm"
     height="340mm"
     viewBox="0 0 288 340"
     preserveAspectRatio="none">

  <!-- White outside, transparent rounded centre.
       Uses even-odd fill because QGIS may not render SVG masks correctly. -->
  <path
      d="
        M 0,0
        H 288
        V 340
        H 0
        Z

        M 10,0
        H 278
        A 10,10 0 0 1 288,10
        V 330
        A 10,10 0 0 1 278,340
        H 10
        A 10,10 0 0 1 0,330
        V 10
        A 10,10 0 0 1 10,0
        Z"
      fill="#ffffff"
      fill-rule="evenodd"
      clip-rule="evenodd"/>
</svg>
