  <path fill="white" fill-rule="evenodd"
        d="
        M 0,0 H410 V210 H0 Z
        M 0,6
        A6,6 0 0 1 6,0
        H404
        A6,6 0 0 1 410,6
        V204
        A6,6 0 0 1 404,210
        H6
