<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="288mm"
     height="340mm"
     viewBox="0 0 288 340"
     preserveAspectRatio="none">
  <defs>
    <mask id="rounded-cutout"
          maskUnits="userSpaceOnUse"
          x="0" y="0" width="288" height="340">
      <rect x="0" y="0" width="288" height="340" fill="white"/>
      <rect x="0" y="0" width="288" height="340"
            rx="10" ry="10" fill="black"/>
    </mask>
  </defs>

  <rect x="0" y="0"
        width="288" height="340"
        fill="#ffffff"
        mask="url(#rounded-cutout)"/>
</svg>
