<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="410mm"
     height="210mm"
     viewBox="0 0 410 210"
     preserveAspectRatio="none">

  <!-- Exact 410 × 210 mm canvas -->
  <rect x="0" y="0" width="410" height="210"
        fill="none" stroke="none"/>

  <!-- White corner mask; transparent rounded interior -->
  <path
    d="
      M 0,0
      H 410
      V 210
      H 0
      Z

      M 6,0
      H 404
      A 6,6 0 0 1 410,6
      V 204
      A 6,6 0 0 1 404,210
      H 6
      A 6,6 0 0 1 0,204
      V 6
      A 6,6 0 0 1 6,0
      Z
    "
    fill="#ffffff"
    fill-rule="evenodd"
    clip-rule="evenodd"/>

  <!-- Exact centre divider: x = 205 mm, width = 2 mm -->
  <rect x="204" y="0" width="2" height="210" fill="#ffffff"/>
</svg>
